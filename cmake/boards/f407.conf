# F407 board overrides of prj.conf (applied after prj.conf, before EXTRA_CONF_FILE)

# Module on the Bluetooth header (USART2):
#   hc06  ZS-040 with HC-06 firmware, classic Bluetooth, 9600 baud
#   atom  AtomS3R-CAM running atom/: BLE for the AT console, Wi-Fi camera, 115200 baud
# BT_BAUDRATE follows the module; set it here only for a module set to another speed.
BT_MODULE=hc06
