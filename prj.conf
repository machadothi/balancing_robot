# Balancing robot configuration
#
# KEY=VALUE per line; '#' starts a comment. Applies to every board.
# Board-specific values go in cmake/boards/<board>.conf, personal overlays in a
# file passed with -DEXTRA_CONF_FILE=my.conf, and -D<KEY>=... overrides all of
# them. Every key is documented in docs/02-build-and-configuration.md.

# ---- Consoles ----------------------------------------------------------------
CONSOLE_USB=ON
# CONSOLE_BT defaults to ON on boards with a Bluetooth port (F407 board)
CONSOLE_ECHO=ON
UART_BAUDRATE=921600
BT_BAUDRATE=115200

# ---- Control -----------------------------------------------------------------
IMU_SAMPLE_RATE_MS=10
ATTITUDE_FILTER=complementary
AUTO_ENABLE=OFF

# ---- Features ----------------------------------------------------------------
TELEMETRY=ON
WATCHDOG=ON
FAULT_VERBOSE=ON
I2C_BUS_RECOVERY=ON
AT_CMD_PID_TOGGLE=ON
AT_CMD_HELP=OFF
AT_CMD_ALL_QUERY=OFF
LOGGING=OFF

# ---- RTOS --------------------------------------------------------------------
FREERTOS_TICK_RATE_HZ=1000
